name: ETL Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 02:00 ET (pré-mercado EUA)
  workflow_dispatch:      # execução manual via GitHub UI

env:
  PYTHON_VERSION: '3.11'

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          python database/connection.py

      - name: Run ETL pipeline
        id: etl
        run: |
          python -m etl.run_pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        continue-on-error: false

      - name: Upload processed data as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: processed-data-${{ github.run_id }}
          path: |
            data/processed/
            data/raw/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ ETL Pipeline falhou no edumetria-wc26-cockpit",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Falha no ETL*\nRepositório: ${{ github.repository }}\nRun: ${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  validate:
    needs: etl
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data-${{ github.run_id }}
          path: data/

      - name: Run data validation tests
        run: |
          pytest tests/test_data_quality.py -v

      - name: Run pipeline integrity tests
        run: |
          pytest tests/test_pipeline.py -v
